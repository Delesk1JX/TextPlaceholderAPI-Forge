plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: "[${minecraft_version},1.21)",
            forge_version           : forge_version,
            forge_version_range     : "[47,)",
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            version                 : "${mod_version}+${minecraft_version}",
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', 'modrinth.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-URL'      : 'https://github.com/Delesk1JX/TextPlaceholderAPI-Forge',
        ])
    }

    // Shipped under the name the upstream project uses, so the jar keeps the original's
    // attribution. The file is named LICENSE at the repo root so GitHub detects LGPL-3.0.
    from('LICENSE') {
        rename { 'LICENSE_placeholder-api' }
    }

    // mods.toml's logoFile is resolved from the jar root, so the icon has to live there too.
    from('src/main/resources/assets/icon.png') {
        rename { 'icon.png' }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact(jar) { builtBy jar }
            artifact(sourcesJar) { builtBy sourcesJar }
        }
    }

    repositories {
        maven {
            name = 'localStaging'
            url = layout.buildDirectory.dir('repo')
        }
    }
}

// ---------------------------------------------------------------- publishing --
// Tokens are read from the environment so nothing secret is ever committed:
//
//   CURSEFORGE_API_TOKEN   -> https://www.curseforge.com/account/api-tokens
//   MODRINTH_API_TOKEN     -> https://modrinth.com/settings/pats
//   CHANGELOG              -> optional release notes
//
// Then:  ./gradlew build publishMods
def changelog = System.getenv('CHANGELOG') ?: ''

publishMods {
    changelog = changelog
    type = is_stable == 'true' && !mod_version.contains('-') ? STABLE : BETA
    file = tasks.jar.archiveFile
    modLoaders.add('forge')

    if (System.getenv('CURSEFORGE_API_TOKEN') && project.curseforge_project_id) {
        curseforge {
            projectId = project.curseforge_project_id
            accessToken = System.getenv('CURSEFORGE_API_TOKEN')
            client = true
            server = true
            minecraftVersions.add(minecraft_version)
        }
    }

    if (System.getenv('MODRINTH_API_TOKEN') && project.modrinth_project_id) {
        modrinth {
            projectId = project.modrinth_project_id
            accessToken = System.getenv('MODRINTH_API_TOKEN')
            minecraftVersions.add(minecraft_version)
        }
    }
}
